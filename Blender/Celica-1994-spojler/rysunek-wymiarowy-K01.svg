<text class="title" x="65" y="79">CELICA 1994 / SPOJLER K01</text>
<text class="sub" x="65" y="111">Autorski wzorzec powierzchni zewnętrznej • wymiary nominalne • jednostki: mm</text>
<text class="small" x="1608" y="70" text-anchor="end">REWIZJA K01</text>
<text class="tiny" x="1608" y="101" text-anchor="end">Wydruk nie jest szablonem 1:1</text>
<line class="rule" x1="65" y1="138" x2="1615" y2="138"/>
