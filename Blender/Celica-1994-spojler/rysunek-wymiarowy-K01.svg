<text class="tiny" x="65" y="836">Y–Z · powiększenie względem pozostałych rzutów</text>
<g transform="translate(0 17)">
<rect class="part" x="294" y="862" width="252" height="182" rx="6"/>
<rect class="part" x="266" y="1044" width="308" height="16" rx="5"/>
