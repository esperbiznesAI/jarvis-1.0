<path class="dim" d="M240 1091 H600"/>
<text class="num" x="420" y="1082" text-anchor="middle">180</text>
<path class="ext" d="M264 840 H184 M250 1060 H184"/>
<path class="dim" d="M197 840 V1060"/>
<text class="num" transform="translate(183 950) rotate(-90)" text-anchor="middle">110</text>
<path class="ext" d="M582 1044 H649 M582 1060 H649"/>
<path class="dim" d="M637 1044 V1060"/>
<text class="num" x="657" y="1059">8</text>
<text class="tiny" x="240" y="926">przód</text>
<text class="tiny" x="556" y="926">tył</text>
<text class="tiny" x="422" y="1024" text-anchor="middle">podstawa na Z=0</text>
</g>
<rect x="720" y="811" width="895" height="285" rx="8" fill="#f1f5f6"/>
<text class="section" x="744" y="845">ZAKRES RYSUNKU</text>
<text class="note" x="744" y="878">Wymiary spoilera są autorskie. Rzuty i przejścia uproszczono.</text>
<text class="note" x="744" y="908">Zaokrąglenia: podpory i podstawy 3 mm; końce belki 0,75 mm.</text>
<text class="note" x="744" y="938">Obrysy podstaw nie określają płaskiego pola styku po zaokrągleniu.</text>
<text class="note" x="744" y="968">Pełna bryła: brak projektu ścianek, wzmocnień i mocowania.</text>
<text class="note" x="744" y="998">Dopasowanie wymaga pomiarów klapy i przymiarki na aucie.</text>
<text class="small" x="744" y="1034">Referencja: USA 1994 Celica GT Sport Coupe / ST204.</text>
<text class="tiny" x="744" y="1060">Toyota: szerokość auta 68,9 cala ≈ 1750 mm; to nie wymiar klapy.</text>
<text class="tiny" x="744" y="1083">Źródło i pozostałe dane: README.md / broszura Toyota, PDF s. 15.</text>
<line class="rule" x1="65" y1="1128" x2="1615" y2="1128"/>
<text class="small" x="65" y="1151">K01 • WZORZEC / PROTOTYP • brak otworów montażowych • dopasowanie i konstrukcja niezweryfikowane</text>
<text class="tiny" x="1612" y="1151" text-anchor="end">Arkusz 1 / 1</text>
</svg>
