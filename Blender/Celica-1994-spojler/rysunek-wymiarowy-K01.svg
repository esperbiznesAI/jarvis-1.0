<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 1680 1188">
<title>Celica 1994 — spojler K01, nominalne wymiary projektu</title>
<desc>Trzy schematyczne rzuty spoilera. Wymiary mm: 1320 na 180 na 110. Rozstaw osi 1218. Podstawy płaskie na Z zero, bez otworów, niedopasowane do konkretnego auta.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 5 L0 0 L0 10 Z" fill="#22677a"/></marker>
<style>
text{font-family:"DejaVu Sans",Arial,sans-serif;fill:#182b35}
.title{font-size:34px;font-weight:700}.sub{font-size:19px;fill:#54636a}.section{font-size:21px;font-weight:700;letter-spacing:1px}
.small{font-size:17px}.tiny{font-size:15px;fill:#54636a}.note{font-size:18px}
.part{fill:#e9eef0;stroke:#243f4a;stroke-width:2.4;stroke-linejoin:round}
.hidden{fill:none;stroke:#718894;stroke-width:1.8;stroke-dasharray:8 6}
.axis{fill:none;stroke:#889da6;stroke-width:1.2;stroke-dasharray:16 5 3 5}
.dim{fill:none;stroke:#22677a;stroke-width:1.6;marker-start:url(#arrow);marker-end:url(#arrow)}
.ext{fill:none;stroke:#8299a3;stroke-width:1.2}
.num{font-size:20px;font-weight:600;fill:#22677a;paint-order:stroke;stroke:#fff;stroke-width:7px;stroke-linejoin:round}
.rule{stroke:#d8e1e5;stroke-width:1.5}
</style></defs>
