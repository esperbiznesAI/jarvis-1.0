<text class="section" x="1036" y="879">ZAŁOŻENIA I ZAKRES</text>
<text class="note" x="1036" y="909">Płetwy: grubość 6; podpory: grubość 18.</text>
<text class="note" x="1036" y="937">Promienie krawędzi: skrzydło 0,6; podpory 1,5;</text>
<text class="note" x="1036" y="962">podstawy 2; płetwy 1. Rzuty uproszczone.</text>
<text class="note" x="1036" y="990">Wycięcia podpór nie służą do mocowania.</text>
<text class="note" x="1036" y="1018">Wymiary autorskie; podstawy wymagają przymiarki.</text>
<text class="note" x="1036" y="1046">Brak projektu mocowań, ścianek i wzmocnień.</text>
<text class="tiny" x="1036" y="1084">Referencja: Celica GT Sport Coupe USA 1994 / ST204</text>
